<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <H1>DATA DIRI SISWA</H1>

 <form action="/simpan" method="post">
  <label>Nama Siswa:</label>
  <input type="text" name="nama">

  <br>

    <label> Nomor Induk Asal:</label>   
    <input type="number" name="nis">

    <!--<input type="submit" value="Simpan">-->
    <br>
    <label>NISN:</label>
    <input type="number" name="nisn">

    <br>
    <label>Tanggal Lahir:</label>
    <input type="date" name="ttl">

    <br>
    <label>Jenis Kelamin:</label> 
    <input type="radio" name="gender" value="Laki-laki">Laki-laki
    <input type="radio" name="gender" value="Perempuan">Perempuan    
    
    <br>
    <label>Agama:</label>
    <input type="text" name="agama">    

    <br>
    <label>Anak Ke:</label>
    <input type="number" name="ank">

    <br>
    <label>Status anak dalam keluarga:</label>
    <input type="radio" name="status" value="Kandung">Kandung
    <input type="radio" name="status" value="Angkat">Angkat
    <input type="radio" name="status" value="Lainnya">
    <label>Lainya:</label>
    <input type="text" name="status_lainnya">

    <br>
    <label>Alamat siswa:</label>
    <input type="text" name="alamat">

    <br>
    <label>No telpon siswa:</label>
    <input type="number" name="telpon">

    <br>
    <label>Asal Sekolah:</label>
    <input type="text" name="asal_sekolah">

    <br>

    <h1>DATA ORANG TUA SISWA</h1>

    <label>Nama Ayah:</label>
    <input type="text" name="nama_ayah">    

    <br>
    <label>Nama Ibu:</label>
    <input type="text" name="nama_ibu">   
    
    <br>
    <label>Alamat:</label>
    <input type="text" name="alamat_ortu">

    <br>
    <label> Pekerjaan Ayah:</label>
    <input type="text" name="pekerjaan_ayah">

    <br>
    <label>Pekerjaan Ibu:</label>
    <input type="text" name="pekerjaan_ibu">

    <br>
    <label>Pendidikan terakhir ayah:</label>
    <input type="text" name="pendidikan_ayah">  

    <br>
    <label>Pendidikan terakhir ibu:</label> 
    <input type="text" name="pendidikan_ibu">

</form>
</body>
</html>
